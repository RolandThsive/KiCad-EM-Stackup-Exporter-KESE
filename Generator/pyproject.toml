[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kese"
description = "KiCad EM Stackup Exporter: .kicad_pcb boards to exact stack-up solids (STEP, STL, GLB) for EM simulation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
dynamic = ["version"]
dependencies = [
    "numpy", "shapely>=2.0", "mapbox_earcut",
]

[project.optional-dependencies]
kernels = ["manifold3d"]                         # Run.BUILD_WITH_KERNELS: solid unions (about 4 MB)
step = ["manifold3d", "cadquery>=2.5"]           # and STEP by OpenCascade (cadquery: about 1.7 GB)

[project.scripts]
kese = "kese.cli:main"

[tool.setuptools.packages.find]
include = ["kese*", "parameters*"]

[tool.setuptools.package-data]
kese = ["assets/fonts/*"]

[tool.setuptools.dynamic]
version = {attr = "kese.__version__"}
