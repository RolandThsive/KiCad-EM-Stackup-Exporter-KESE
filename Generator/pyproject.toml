[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kese"
description = "KiCad EM Stackup Exporter: .kicad_pcb boards to exact stack-up solids (STEP, STL, GLB) for EM simulation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
dynamic = ["version"]
dependencies = [
    "numpy", "shapely>=2.1", "mapbox_earcut",
]

[project.scripts]
kese = "kese.cli:main"

[tool.setuptools.packages.find]
include = ["kese*", "parameters*"]

[tool.setuptools.package-data]
kese = ["assets/fonts/*"]

[tool.setuptools.dynamic]
version = {attr = "kese.__version__"}
