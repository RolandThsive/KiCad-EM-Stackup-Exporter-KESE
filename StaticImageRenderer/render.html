<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// The pictures of render_image.py: one GLB, turned about the middle of its bounding box by each
// view's Euler angles, seen along -z with y up, on a transparent background.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

window.render = async (o) => {
  const root = (await new GLTFLoader().loadAsync(o.glb)).scene;
  // the model in a pivot, moved so that the middle of its bounding box is on the pivot's origin
  const box = new THREE.Box3().setFromObject(root);
  const centre = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
  root.position.sub(centre);
  const pivot = new THREE.Group();
  pivot.add(root);
  const scene = new THREE.Scene();
  scene.add(pivot);

  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
  renderer.setPixelRatio(1);
  renderer.setSize(o.width, o.height);
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping;
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  // every material gets the room as its own envMap, so that metals and the rest reflect it by
  // different amounts (scene.environment would give one amount to all)
  root.traverse(n => {
    if (!n.isMesh || !n.material || !n.material.isMeshStandardMaterial) return;
    const metal = n.material.metalness > 0.5;
    if (metal && o.metalness !== null) n.material.metalness = o.metalness;
    if (metal && o.roughness !== null) n.material.roughness = o.roughness;
    n.material.envMap = envTex;
    n.material.envMapIntensity = metal ? o.reflectionMetal : o.reflectionOther;
    n.material.needsUpdate = true;
  });
  for (const l of o.lights) {             // fixed to the picture, as the camera is
    const light = new THREE.DirectionalLight(0xffffff, l.intensity);
    light.position.fromArray(l.dir);
    scene.add(light);
  }
  scene.add(new THREE.AmbientLight(0xffffff, o.ambient));

  const half = size.clone().multiplyScalar(0.5);
  const corners = [];
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1])
    corners.push(new THREE.Vector3(sx * half.x, sy * half.y, sz * half.z));
  const aspect = o.width / o.height, keep = 1 - 2 * o.margin;
  const urls = [];
  for (const view of o.views) {
    // turns about the picture's fixed axes in the order given are three.js's Euler order reversed
    pivot.rotation.order = o.order.split('').reverse().join('');
    pivot.rotation.set(...view.map(d => THREE.MathUtils.degToRad(d)));
    pivot.updateMatrixWorld(true);
    const pts = corners.map(c => c.clone().applyMatrix4(pivot.matrixWorld));
    let camera;
    if (o.projection === 'orthographic') {
      // the box's turned corners, as wide and as high as the picture allows inside the margin
      const hw = Math.max(...pts.map(p => Math.abs(p.x))), hh = Math.max(...pts.map(p => Math.abs(p.y)));
      const zmax = Math.max(...pts.map(p => p.z)), depth = size.length() * 2;
      const halfH = Math.max(hh, hw / aspect) / keep;
      camera = new THREE.OrthographicCamera(-halfH * aspect, halfH * aspect, halfH, -halfH, depth / 1000, depth * 2);
      camera.position.set(0, 0, zmax + depth / 2);
    } else {
      // as close as the camera can come while every turned corner stays inside the margin
      camera = new THREE.PerspectiveCamera(o.fov, aspect, 1e-6, 1);
      const fits = dist => {
        camera.position.set(0, 0, dist);
        camera.near = dist / 1000; camera.far = dist * 10;
        camera.updateProjectionMatrix();
        camera.updateMatrixWorld(true);
        return pts.every(p => {
          const v = p.clone().project(camera);
          return Math.abs(v.x) <= keep && Math.abs(v.y) <= keep && v.z <= 1;
        });
      };
      let lo = size.length(), hi = lo * 2;    // nearer than the whole diagonal, corners could be behind the camera
      while (!fits(hi)) hi *= 2;
      if (fits(lo)) hi = lo;
      for (let k = 0; k < 40; k++) { const mid = (lo + hi) / 2; if (fits(mid)) hi = mid; else lo = mid; }
      fits(hi);
    }
    camera.up.set(0, 1, 0);
    camera.lookAt(camera.position.x, camera.position.y, camera.position.z - 1);
    camera.updateProjectionMatrix();
    camera.updateMatrixWorld(true);
    renderer.render(scene, camera);
    urls.push(renderer.domElement.toDataURL('image/png'));
  }
  pmrem.dispose();
  renderer.dispose();
  return urls;
};
window.ready = true;
</script>
</body></html>
