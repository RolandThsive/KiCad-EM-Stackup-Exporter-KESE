# Publishes the web tool (WebUI/) and the generator it runs (Generator/kese, Generator/parameters) to GitHub Pages.
# It runs when the WebUI branch changes (a merged pull request from WebUI_modifs), or by hand (Actions > Run workflow).
# Settings > Pages: Source "GitHub Actions".  Settings > Environments > github-pages: allow the WebUI branch.
name: Web UI On GitHub Pages

on:
  push:
    branches: [WebUI]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # build_site.py packs the generator into WebUI/generator.zip and copies the page (standard library only)
      - name: Build the site
        run: python WebUI/build_site.py _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
