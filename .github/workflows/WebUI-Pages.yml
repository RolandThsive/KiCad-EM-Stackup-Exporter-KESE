# Publishes the web tool (WebUI/) and the generator it runs (Generator/kese, Generator/parameters) to GitHub Pages.
# It runs when the WebUI branch changes (a merged pull request from WebUI_modifs), or by hand (Actions > Run workflow).
# Settings > Pages: Source "GitHub Actions".  Settings > Environments > github-pages: allow the WebUI branch.
# After the deploy, "smoke" opens the published page in Chromium (WebUI/tests/specs/live.spec.mjs): it must start on
# the real jsDelivr, name this commit in its footer and make a board.  If it fails, see "Rolling back" in
# WebUI/README.md.  Every action is pinned to a commit (the tag in the comment); Dependabot proposes updates.
name: Web UI On GitHub Pages

on:
  push:
    branches: [WebUI]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"

      # build_site.py packs the generator into WebUI/generator.zip, copies the page and puts the backup copy of
      # Pyodide and three.js beside it, every file checked against WebUI/vendor.json (standard library only)
      - name: Build the site
        run: python WebUI/build_site.py _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d   # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1

  smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Install the test tools
        working-directory: WebUI/tests
        run: npm ci --no-audit --no-fund
      - name: Open the published page and make a board
        working-directory: WebUI/tests
        env:
          KESE_LIVE_URL: ${{ needs.deploy.outputs.page_url }}WebUI/
          KESE_EXPECT_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          export KESE_EXPECT_COMMIT="${KESE_EXPECT_COMMIT:0:7}"
          npx playwright test --project=chromium
