# Lives only on the corpus-testing branch. A board is its data folder in corpus-testing/data/: at every push the maker
# makes each board's tables and chart from it, and the engine takes out a board whose data folder is gone, numbers the
# boards, renames the folders whose number moved and builds every Corpus Testing page, the Credits and the counts. The
# result is committed here and main's Sync Wiki is started, so the wiki follows. It runs at every push, with no paths
# filter: GitHub looks only at the first 300 files of a push for one, so a push of many boards would not start it. A
# push that changes no board changes nothing.
name: Corpus Engine

on:
  push:
    branches: [corpus-testing]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: corpus-engine
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install what the charts are drawn with
        run: python -m pip install -q matplotlib==3.11.2 pillow==12.3.0      # its own font, DejaVu Sans, draws them

      - name: Make each board's tables and chart from its data folder
        shell: bash          # with pipefail: the maker failing fails the step, though tee does not
        run: python corpus-testing/engine/maker/make.py | tee "$RUNNER_TEMP/make.log"

      - name: Number the boards and build the pages
        run: python corpus-testing/engine/assemble.py .

      - name: Commit and push what changed
        id: commit
        run: |
          git add -A docs/tables docs/images docs/wiki corpus-testing/data credits.txt README.md
          if git diff --cached --quiet; then echo "The pages were already up to date."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Corpus Engine: boards numbered and pages built"
          git push || { git pull -q --rebase origin corpus-testing && git push; }
          echo "changed=1" >> "$GITHUB_OUTPUT"

      # a push made with the workflow's own token starts no other workflow, so the wiki sync is started here
      - name: Start Sync Wiki on main
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run WikiSync.yml --repo "$GITHUB_REPOSITORY" --ref main

      # a data folder the maker could not use (broken JSON, a field missing, the same board twice) or rejected (fewer
      # than six runs: deleted, with all made from it) fails the run, so it is seen; the other boards are made and the
      # pages built all the same
      - name: Report the data folders not made into boards
        if: always()
        run: |
          test -f "$RUNNER_TEMP/make.log" || exit 0
          if grep -E "^(not made|rejected):" "$RUNNER_TEMP/make.log"; then
            grep -E "^(not made|rejected):" "$RUNNER_TEMP/make.log" | sed 's/^/::error::/'
            exit 1
          fi
