<!--
  BloggerPage.html - paste this whole file into a Blogger page (Pages > New Page > the pencil's "HTML view").

  It hides everything else on the page (header, sidebar, title, comments, footer), fills the window with the
  KiCad EM Stackup Exporter (which has its own Back and Home buttons), with a Back and a Home button for phones.  The tool itself is served from
  the GitHub repository (GitHub Pages, the WebUI branch) and runs in the visitor's browser; phones get a short
  message instead.

  Change APP_URL below if the GitHub Pages address changes (it follows the repository name).
-->
<style>
  html, body { overflow: hidden !important; height: 100% !important; }
  body * { visibility: hidden !important; }                      /* the blog stays, unseen and unclickable */
  #kese-shell, #kese-shell * { visibility: visible !important; }
  #kese-shell { position: fixed; inset: 0; z-index: 2147483000; margin: 0; padding: 0; }
  #kese-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
  #kese-nav { position: absolute; top: 12px; right: 16px; display: flex; gap: 8px; z-index: 2; }
  /* with the tool shown, its own Back and Home sit in its top bar and scroll with it; these are for phones only */
  #kese-shell:not(.phone) #kese-nav { display: none; }
  #kese-nav a {
    width: 38px; height: 38px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, 0.3); border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); transition: all 0.3s ease; cursor: pointer;
  }
  #kese-nav a:hover { background: rgba(248, 236, 198, 0.4); }
  #kese-nav svg { width: 20px; height: 20px; fill: none; stroke: #333; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: all 0.3s ease; }
  #kese-nav a:hover svg { stroke: #a93e33; }
  #kese-phone { display: none; position: absolute; inset: 0; padding: 80px 28px; text-align: center; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #kese-phone h1 { font-family: "Permanent Marker", cursive; font-weight: normal; font-size: 26px; margin: 0 0 16px; }
  #kese-phone p { font-size: 16px; line-height: 1.5; color: #555555; }
  #kese-shell.phone #kese-phone { display: block; }
  #kese-shell.phone #kese-frame { display: none; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">

<div id="kese-shell">
  <iframe id="kese-frame" title="KiCad EM Stackup Exporter" allow="fullscreen" allowfullscreen></iframe>
  <div id="kese-phone">
    <h1>KiCad EM Stackup Exporter</h1>
    <p>The exporter needs a computer. Open this page on a laptop or desktop.</p>
    <p>It runs the full Python generator inside your browser, which needs a big screen and a mouse.</p>
  </div>
  <nav id="kese-nav">
    <a id="kese-back" title="Back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
    <a id="kese-home" title="Home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 9.5V20h4.5v-6h3v6H18V9.5"/></svg></a>
  </nav>
</div>

<script>
(function () {
  var APP_URL = "https://rolandthsive.github.io/KiCad-EM-Stackup-Exporter-KESE/WebUI/";
  var HOME = location.origin + "/";

  var shell = document.getElementById("kese-shell");
  var frame = document.getElementById("kese-frame");
  document.body.appendChild(shell);           // out of the theme's wrappers, so nothing can clip or shift it

  // The tab shows the KESE logo, not the blog's icon (the tool's own favicon cannot reach the tab from inside a frame).
  var icons = document.querySelectorAll('link[rel~="icon"]');
  for (var i = 0; i < icons.length; i++) icons[i].parentNode.removeChild(icons[i]);
  var icon = document.createElement("link");
  icon.rel = "icon"; icon.href = APP_URL + "favicon.ico";
  document.head.appendChild(icon);

  // Home: the blog's front page.  Back: the page the visitor came from on this blog, else the front page.
  document.getElementById("kese-home").href = HOME;
  var back = document.getElementById("kese-back");
  back.href = HOME;
  back.addEventListener("click", function (e) {
    var cameFromBlog = document.referrer && document.referrer.indexOf(location.origin) === 0;
    if (cameFromBlog && history.length > 1) { e.preventDefault(); history.back(); }
  });

  // Phones and tablets (no mouse or trackpad) get the message only, the same test the tool uses.
  var touchOnly = window.matchMedia("(pointer: coarse)").matches && !window.matchMedia("(any-pointer: fine)").matches;
  if (touchOnly) { shell.className = "phone"; return; }
  frame.src = APP_URL;
})();
</script>
