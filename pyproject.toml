[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kese"
description = "KiCad EM Stackup Exporter: .kicad_pcb boards to exact stack-up solids (STEP, STL, GLB) for EM simulation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
dynamic = ["version"]
dependencies = [
    "numpy", "scipy", "networkx", "shapely>=2.0", "trimesh>=4.0", "manifold3d", "mapbox_earcut", "rtree",
]

[project.optional-dependencies]
step = ["cadquery>=2.5"]

[project.scripts]
kese = "run_KESE:main"

[tool.setuptools]
packages = ["Generator", "Generator.Common", "Generator.Geometry", "Generator.Packager", "Parameters"]
py-modules = ["run_KESE"]

[tool.setuptools.package-data]
Parameters = ["Fonts/*"]

[tool.setuptools.dynamic]
version = {attr = "Generator.__version__"}
