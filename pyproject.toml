# KiCad EM Stackup Exporter (KESE)
#   python -m pip install -e .            the `kese` command, with Parameters/ editable in place
#   python -m pip install -e ".[step]"    the same, with cadquery for STEP output
#
# The dependencies here are unpinned, so this works on Python 3.11 too. requirements.txt pins the
# tested versions, which need Python 3.12 or newer. Input/ and Output/ are relative to the folder
# the command is run from (Run_Parameters.INPUT_DIR / OUTPUT_DIR).
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kese"
dynamic = ["version"]
description = "KiCad EM Stackup Exporter: .kicad_pcb -> solids for EM simulation, or a visual surface"
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "COMMERCIAL.md", "Parameters/Fonts/LICENSE_fonts.txt"]
dependencies = [
    "numpy",
    "scipy",
    "networkx",
    "shapely",
    "trimesh",
    "manifold3d",
    "mapbox_earcut",
    "rtree",
]

[project.optional-dependencies]
step = ["cadquery", "cadquery-ocp>=7.9.3.1,<8.0"]

[project.scripts]
kese = "run_KESE:main"

[tool.setuptools]
py-modules = ["run_KESE"]

[tool.setuptools.packages.find]
include = ["Generator*", "Parameters*"]

[tool.setuptools.package-data]
Parameters = ["Fonts/*"]

[tool.setuptools.dynamic]
version = {attr = "Generator.__version__"}
